server {
    listen 80;
    root /usr/share/nginx/html;

    # Hindcast spreadsheets, photos/drawings and report .docx files (convert.py allows 50 MB).
    client_max_body_size 100m;

    # Docker's DNS, re-resolved so a recreated backend container (new IP) doesn't 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # /callback is Authentik's redirect back after sign-in (see backend/app/sso.py).
    location ~ ^/(api/|plots/|study-files/|callback$) {
        proxy_pass $backend;
        # $http_host, not $host: keeps the port, which the sign-in redirect URI is built from.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A calculation that downloads Copernicus/NDBC data, or the first NDBC buoy list, can
        # take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
